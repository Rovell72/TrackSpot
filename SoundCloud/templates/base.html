{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TrackSpot</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center;">
        <a href="{% url 'home' %}" style="text-decoration: none;"><b>TrackSpot</b></a>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'upload_track' %}" style="color: #ff5500; margin-right: 15px; font-weight: bold;">+ Загрузить трек</a>
                <a href="{% url 'profile' %}" style="color: white; margin-right: 15px;">Профиль ({{ user.username }})</a>
                <form action="{% url 'logout' %}" method="post" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" style="color: white; margin-right: 15px;">Войти</a>
                <a href="{% url 'register' %}" style="color: #ff5500;">Регистрация</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% if messages %}
            <div id="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
