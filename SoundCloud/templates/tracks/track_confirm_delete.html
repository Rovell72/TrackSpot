{% extends 'base.html' %}
{% block content %}
    <h2>Удаление трека</h2>
    <p>Вы точно хотите удалить трек <b>«{{ track.title }}»</b>?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="background: red; color: white;">Да, удалить</button>
        <a href="{% url 'home' %}">Отмена</a>
    </form>
{% endblock %}
