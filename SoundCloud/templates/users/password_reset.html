{% extends 'base.html' %}
{% block content %}
    <h2>Сброс пароля</h2>
    <p>Введите email вашего аккаунта.</p>
    <form method="POST">
        {% csrf_token %}
        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>
        <button type="submit">Далее</button>
    </form>
    <p><a href="{% url 'login' %}">Назад к входу</a></p>
{% endblock %}
