{% extends 'base.html' %}
{% block content %}
    <h2>Личный кабинет: {{ user.username }}</h2>
    
    {% if user.profile.avatar %}
        <img src="{{ user.profile.avatar.url }}" width="120" height="120" style="border-radius: 50%; object-fit: cover;">
    {% else %}
        <p><i>Аватар не загружен</i></p>
    {% endif %}

    <p>Ваш статус: <b>{{ user.profile.get_role_display }}</b></p>

    <hr>
    <h3>Редактировать данные</h3>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ u_form.as_p }}
        {{ p_form.as_p }}
        <button type="submit">Сохранить изменения</button>
    </form>
{% endblock %}
