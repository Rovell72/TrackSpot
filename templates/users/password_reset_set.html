{% extends 'base.html' %}
{% block title %}Новый пароль — TrackSpot{% endblock %}
{% block content %}
<div class="panel panel--narrow">
    <h2 class="panel__title">Новый пароль для {{ reset_user.username }}</h2>
    <form method="POST" class="form">
        {% csrf_token %}
        <div class="form__row">
            <label class="form__label" for="id_password1">Новый пароль<span class="form__required">*</span></label>
            <input type="password" name="password1" id="id_password1" required>
        </div>
        <div class="form__row">
            <label class="form__label" for="id_password2">Подтвердите пароль<span class="form__required">*</span></label>
            <input type="password" name="password2" id="id_password2" required>
        </div>
        <button type="submit" class="btn btn--block">Сохранить</button>
        <div class="form__footer"><a href="{% url 'login' %}">← Назад к входу</a></div>
    </form>
</div>
{% endblock %}
