{% extends 'base.html' %}
{% block title %}Регистрация — TrackSpot{% endblock %}
{% block content %}
<div class="panel panel--narrow">
    <h2 class="panel__title">Регистрация</h2>
    <form method="POST" class="form" novalidate>
        {% csrf_token %}
        {% include 'includes/form_fields.html' %}
        <button type="submit" class="btn btn--block">Создать аккаунт</button>
        <div class="form__footer">
            <span>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></span>
        </div>
    </form>
</div>
{% endblock %}
