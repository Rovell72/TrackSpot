{% extends 'base.html' %}
{% block title %}Сброс пароля — TrackSpot{% endblock %}
{% block content %}
<div class="panel panel--narrow">
    <h2 class="panel__title">Сброс пароля</h2>
    <p class="muted">Введите email вашего аккаунта.</p>
    <form method="POST" class="form">
        {% csrf_token %}
        <div class="form__row">
            <label class="form__label" for="id_email">Email<span class="form__required">*</span></label>
            <input type="email" name="email" id="id_email" required>
        </div>
        <button type="submit" class="btn btn--block">Далее</button>
        <div class="form__footer"><a href="{% url 'login' %}">← Назад к входу</a></div>
    </form>
</div>
{% endblock %}
