{% if form.non_field_errors %}
    <div class="alert alert--error">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
    <div class="form__row{% if field.errors %} form__row--error{% endif %}">
        <label class="form__label" for="{{ field.id_for_label }}">
            {{ field.label }}{% if field.field.required %}<span class="form__required">*</span>{% endif %}
        </label>
        {{ field }}
        {{ field.errors }}
        {% if field.help_text %}<div class="form__help">{{ field.help_text|safe }}</div>{% endif %}
    </div>
{% endfor %}
