<header class="site-header">
    <div class="site-header__inner">
        <a href="{% url 'home' %}" class="logo"><span class="logo__mark">♫</span>Track<b>Spot</b></a>
        <nav class="nav">
            {% if user.is_authenticated %}
                <a href="{% url 'upload_track' %}" class="nav__link nav__link--accent">＋ <span class="nav__text">Загрузить трек</span></a>
                <a href="{% url 'profile' %}" class="nav__link">
                    {% if user.profile.avatar %}
                        <img class="nav__avatar" src="{{ user.profile.avatar.url }}" alt="">
                    {% else %}
                        <span class="nav__avatar nav__avatar--empty">{{ user.username|slice:":1"|upper }}</span>
                    {% endif %}
                    <span class="nav__text">{{ user.username }}</span>
                </a>
                <form action="{% url 'logout' %}" method="post">
                    {% csrf_token %}
                    <button type="submit" class="nav__link">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="nav__link">Войти</a>
                <a href="{% url 'register' %}" class="nav__link nav__link--accent">Регистрация</a>
            {% endif %}
        </nav>
    </div>
</header>
