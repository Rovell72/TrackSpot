{% extends 'base.html' %}
{% block title %}{{ title }} — TrackSpot{% endblock %}
{% block content %}
<div class="panel panel--medium">
    <h2 class="panel__title">{{ title }}</h2>
    <form method="POST" enctype="multipart/form-data" class="form" novalidate>
        {% csrf_token %}
        {% include 'includes/form_fields.html' %}
        <div class="btn-row">
            <button type="submit" class="btn">Сохранить</button>
            <a href="{% url 'home' %}" class="btn btn--secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
